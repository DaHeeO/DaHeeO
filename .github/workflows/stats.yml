
name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=DaHeeO&show_icons=true&bg_color=080D0A&title_color=4ADE80&text_color=B5C6BB&icon_color=4ADE80&border_color=315C43
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=DaHeeO&layout=compact&langs_count=8&bg_color=080D0A&title_color=4ADE80&text_color=B5C6BB&border_color=315C43
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate MESC Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=DaHeeO&repo=MESC&bg_color=080D0A&title_color=4ADE80&text_color=B5C6BB&icon_color=4ADE80&border_color=315C43
          path: profile/mesc.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate SquareV2 Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=DaHeeO&repo=SquareV2&bg_color=080D0A&title_color=4ADE80&text_color=B5C6BB&icon_color=4ADE80&border_color=315C43
          path: profile/squarev2.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate SSAK3 Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=DaHeeO&repo=SSAK3&bg_color=080D0A&title_color=4ADE80&text_color=B5C6BB&icon_color=4ADE80&border_color=315C43
          path: profile/ssak3.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit SVG Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub stats"
          git push
